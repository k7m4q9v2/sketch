<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Create and edit music with SoundFonts."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./minimal.css"><link rel="stylesheet" href="./finish.css"><link rel="stylesheet" href="./editor.css"><title>Sketch — SoundFont</title></head>
<body><div id="app" class="projects-open">
<section id="project-page"><header class="project-page-header"><h1 id="profile-name">Projects</h1><div><button id="new-project" aria-label="New project">＋</button></div></header><div id="project-list"></div></section><header class="app-header"><button id="back-to-projects" class="back-button" aria-label="Back to projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><div class="project-label"><button id="project-name" title="Rename project">Untitled sketch</button><span id="save-status">Loading…</span></div><nav><button id="main-menu" class="icon-button" aria-label="Export">Export</button><button hidden id="projects-btn" class="icon-button" aria-label="Open projects" title="Projects">Projects</button><button id="save-btn" class="header-save">Save</button><button hidden id="export-btn" class="accent-button">Export <span>↗</span></button></nav></header>
<section class="transport" aria-label="Transport"><div class="transport-controls"><button id="play" class="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 4 20 12 8 20Z" fill="currentColor"/></svg></button><button id="stop" class="icon-button" hidden aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button><div class="position" id="position" hidden>01<span>:</span>01<span>:</span>00</div></div><div class="transport-settings"><button id="bpm" class="bpm-picker" aria-label="BPM" aria-haspopup="dialog"><output id="bpm-value">110</output><span>BPM</span></button><span class="divider"></span><label class="bars-label"><button id="bars-picker" class="value-picker" aria-label="Loop length" aria-haspopup="dialog">4 bars</button><select hidden id="bars" aria-label="Loop length"><option value="1">1 bar</option><option value="2">2 bars</option><option value="4" selected>4 bars</option><option value="8">8 bars</option><option value="16">16 bars</option><option value="32">32 bars</option></select></label><div id="master-pitch-knobs" class="transport-pitch"></div><button id="metronome" class="icon-button metro" aria-pressed="false" aria-label="Metronome" title="Metronome"><svg viewBox="0 0 24 24"><path d="m9 4-5 16h16L15 4ZM12 16l6-12M8 16h8"/></svg></button></div><div class="audio-state" hidden><span id="audio-light"></span><span id="audio-status">Tap Play to start audio</span><div class="meter"><i id="meter-fill"></i></div></div></section>
<main id="studio" class="studio">
<div hidden id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Screen divider" aria-valuemin="25" aria-valuemax="65" aria-valuenow="40" tabindex="0"><span></span></div>
<section class="sequencer panel" aria-label="Channel Rack and Piano Roll"><aside class="rack"><div class="panel-heading"><h2>Channel Rack</h2></div><div id="channels" class="channels"></div><button id="add-channel" class="add-channel" aria-label="Add channel">＋</button></aside><div class="roll-panel"><div class="roll-heading"><div><button id="back-to-rack" class="back-button" aria-label="Back to rack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button id="go-to-start" class="icon-button" aria-label="Go to start" title="Go to start"></button></div><div class="history-buttons"><button id="roll-channel-menu" class="icon-button" aria-label="Export">Export</button><button id="undo" class="icon-button" aria-label="Undo" title="Undo · Ctrl Z"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h10a7 7 0 0 1 7 7"/></svg></button><button id="redo" class="icon-button" aria-label="Redo" title="Redo · Ctrl Shift Z"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 5 5 5-5 5m5-5H11a7 7 0 0 0-7 7"/></svg></button></div></div><div class="roll-toolbar"><div class="tool-group"><button id="draw-tool" class="tool active" aria-label="Pencil" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m4 16 12-12 4 4L8 20H4ZM14 6l4 4"/></svg></button><button id="erase-tool" class="tool" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m14 3 7 7-10 11H6l-4-5Z M6 12l7 7 M11 21h10"/></svg></button><button id="slide-tool" class="tool" aria-label="Slide notes" aria-pressed="false">◿</button></div><button id="roll-channel" aria-label="Sound settings">Choose instrument</button><label class="snap-label">Snap <button id="snap-picker" class="value-picker" aria-label="Snap" aria-haspopup="dialog">Step</button></label><span hidden id="zoom-label">100%</span><button id="fit-notes" class="fit-notes" title="Center on notes">Center</button></div><div id="piano-container" class="piano-container"><canvas id="piano-roll" tabindex="0" aria-label="Piano roll. Tap the top ruler to play from that position. Tap to add or select a note. Use Eraser to delete. Drag vertically to change and hear pitch. Drag the right edge to resize. Hold and drag to select notes. Drag empty space or use two fingers to scroll."></canvas><div id="note-popover" class="note-popover" hidden><button id="copy-notes">Copy</button><button id="paste-notes" hidden>Paste</button><button id="paste-right" hidden>Paste right</button><button id="octave-down" hidden aria-label="Selected notes down one octave">− Oct</button><button id="octave-up" hidden aria-label="Selected notes up one octave">+ Oct</button><button id="toggle-slide">Slide notes</button><button id="delete-note">Delete note</button></div></div></div></section>
</main></div>
<dialog id="sound-dialog"><section id="player" class="player panel" aria-label="SoundFont Player">
<div class="panel-heading"><div class="player-title-row"><button id="selector-back" class="back-button" hidden>‹ Back</button><h1 id="player-title">SoundFont</h1></div><button id="sound-close" class="done-button" aria-label="Close sound settings">Done</button><span id="target-channel" class="channel-tag" hidden>CH 01</span></div>
<div class="player-scroll"><button id="font-picker" class="font-picker" aria-label="Choose SoundFont"><span id="font-picker-name">Choose SoundFont</span><span class="chevron">⌄</span></button>
<div class="instrument-controls"><div class="preset-navigation"><button id="preset-prev" aria-label="Previous instrument">‹</button><button id="preset-picker" aria-label="Choose instrument"><span id="preset-picker-name">Choose instrument</span><span class="chevron">⌄</span></button><button id="preset-next" aria-label="Next instrument">›</button></div>
<div id="channel-tuning"><span>Channel cents</span><div id="channel-cents"></div></div><div class="effect-tabs" role="tablist" aria-label="Sound controls"><button id="envelope-tab" role="tab" aria-selected="true" aria-controls="envelope-panel">Envelope</button><button id="delay-tab" role="tab" aria-selected="false" aria-controls="delay-panel">Delay</button></div><div id="envelope-panel" class="envelope-panel effect-panel" role="tabpanel" aria-labelledby="envelope-tab"><div class="control-caption"><label class="toggle-label"><input id="adsr-enabled" type="checkbox" checked> On</label><label class="toggle-label"><input id="env-tempo" type="checkbox"> Tempo</label></div>
<svg id="envelope-graph" class="envelope-graph" viewBox="0 0 340 86" preserveAspectRatio="xMidYMid meet" aria-label="Volume envelope"><path class="graph-grid" d="M8 10H332M8 40H332M8 70H332M89 8V70M170 8V70M251 8V70"/><path id="envelope-line" fill="none" stroke="#a9e5a4" stroke-width="1.6"/><path id="envelope-gate" stroke="#5b6d58" stroke-width="1" stroke-dasharray="3 3"/><g id="envelope-nodes"></g><text x="8" y="83">0</text><text id="env-time" x="332" y="83" text-anchor="end">1 s</text><text id="env-off" y="8" text-anchor="middle">OFF</text></svg>
<div id="envelope-knobs" class="envelope-knobs"></div><div class="tension-row"><span>TENSION</span><div id="tension-knobs"></div></div></div><div id="delay-panel" class="effect-panel" role="tabpanel" aria-labelledby="delay-tab" hidden><div class="delay-caption"><label class="toggle-label"><input id="delay-enabled" type="checkbox"> On</label><span>MASTER</span></div><div class="delay-grid"><section class="delay-group"><h3>INPUT</h3><div class="delay-knobs" id="delay-input"></div></section><section class="delay-group"><h3>FEEDBACK</h3><div class="delay-modes"><label><input type="radio" name="delay-mode" value="normal"> NORMAL</label><label><input type="radio" name="delay-mode" value="invert"> INVERT</label><label><input type="radio" name="delay-mode" value="pingpong"> P.PONG</label></div><div class="delay-knobs" id="delay-feedback"></div></section><section class="delay-group"><h3>TIME</h3><div class="delay-knobs" id="delay-time"></div></section><section class="delay-group"><h3>DRY</h3><div class="delay-knobs" id="delay-dry"></div></section></div></div></div></div>
<div id="player-browser" class="player-browser" hidden><div class="browser-toolbar"><input id="selector-search" type="search" placeholder="Search" aria-label="Search sounds"><label id="browser-import" class="import-button" for="sf2-input">＋ SF2<input id="sf2-input" type="file" accept=".sf2" multiple hidden></label></div><div id="selector-list" class="selector-list" role="listbox" aria-label="Sound list"></div></div>
</section><div id="sound-transport" class="sound-transport"></div>
</dialog><div id="toast" class="toast" role="status" hidden></div><dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Close">×</button></div><div id="dialog-body"></div></dialog><script type="module" src="./app.js"></script></body></html>
